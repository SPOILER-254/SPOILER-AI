services:
  - type: web
    name: spoiler-ai
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: spoiler-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /var/data
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        value: spoiler_ai_verify_token
      - key: MPESA_ENV
        value: sandbox
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
